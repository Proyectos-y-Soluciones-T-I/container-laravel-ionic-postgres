server {
    listen 80;
    server_name localhost;

    root  /var/www/html/public;
    index index.php index.html;

    # Large file uploads inherited from nginx.conf
    client_max_body_size 500M;

    # Laravel routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM — persistent connections reduce per-request overhead
    location ~ \.php$ {
        fastcgi_pass   backend:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        # Reuse FPM connections (avoids TCP handshake per request)
        fastcgi_keep_conn on;

        # Buffer large responses (e.g. DB exports, document downloads)
        fastcgi_buffers              16 32k;
        fastcgi_buffer_size          64k;
        fastcgi_busy_buffers_size    128k;
        fastcgi_temp_file_write_size 256k;

        fastcgi_read_timeout    600s;
        fastcgi_send_timeout    600s;
    }

    # Serve storage files directly — long cache TTL for immutable assets
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static assets — aggressive cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
