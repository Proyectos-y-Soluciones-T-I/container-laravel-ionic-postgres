server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Static dashboard ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|ico|png|jpg|svg)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── Health check proxies ─────────────────────────────────────────────────────
    # nginx probes the host ports from inside Docker (host.docker.internal).
    # Returns 200 if the target nginx responds, 502/504 if it's down.
    # The JS in index.html fetches these endpoints — no CORS involved.

    location = /health/ayudando/frontend {
        proxy_pass http://host.docker.internal:4200;
        proxy_connect_timeout 2s;
        proxy_read_timeout    3s;
        proxy_intercept_errors off;
        access_log off;
    }

    location = /health/ayudando/backend {
        proxy_pass http://host.docker.internal:8080;
        proxy_connect_timeout 2s;
        proxy_read_timeout    3s;
        proxy_intercept_errors off;
        access_log off;
    }

    location = /health/emergencias/frontend {
        proxy_pass http://host.docker.internal:4201;
        proxy_connect_timeout 2s;
        proxy_read_timeout    3s;
        proxy_intercept_errors off;
        access_log off;
    }

    location = /health/emergencias/backend {
        proxy_pass http://host.docker.internal:8081;
        proxy_connect_timeout 2s;
        proxy_read_timeout    3s;
        proxy_intercept_errors off;
        access_log off;
    }

    location = /health/fiscalizacion/frontend {
        proxy_pass http://host.docker.internal:4202;
        proxy_connect_timeout 2s;
        proxy_read_timeout    3s;
        proxy_intercept_errors off;
        access_log off;
    }

    location = /health/fiscalizacion/backend {
        proxy_pass http://host.docker.internal:8082;
        proxy_connect_timeout 2s;
        proxy_read_timeout    3s;
        proxy_intercept_errors off;
        access_log off;
    }

    access_log off;
    error_log /dev/stderr warn;
}
