; Large file upload support
upload_max_filesize = 500M
post_max_size       = 500M

; Memory & timeouts
memory_limit        = 1G
max_execution_time  = 600
max_input_time      = 600

; Queue / mail workers don't timeout
default_socket_timeout = 600

; OPcache — check timestamps every 2s max (not per-request).
; On Windows bind mounts each stat() crosses the WSL2/host boundary — removing per-request stat
; cuts latency noticeably. 2s is still fast enough to pick up code changes in dev.
opcache.enable                  = 1
opcache.revalidate_freq         = 2
opcache.validate_timestamps     = 1
; 64MB covers Laravel 8 + vendor with room to spare (typical usage: 30-45MB).
; Allocated as shared memory upfront — reducing saves real physical RAM.
opcache.memory_consumption      = 64
opcache.max_accelerated_files   = 20000
opcache.interned_strings_buffer = 16
opcache.fast_shutdown           = 1

; JIT — PHP 8.1 trampoline mode.
; Speeds up CPU-bound paths (serialization, collections, validation rules).
; I/O-bound requests (DB, Redis) see no regression. Safe to enable in dev.
opcache.jit                 = trampoline
opcache.jit_buffer_size     = 32M
