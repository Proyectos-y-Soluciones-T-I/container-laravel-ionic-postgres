; Large file upload support
upload_max_filesize = 500M
post_max_size       = 500M

; Memory & timeouts
memory_limit        = 256M
max_execution_time  = 600
max_input_time      = 600

; Queue / mail workers don't timeout
default_socket_timeout = 600

; OPcache — check timestamps every 2s max (not per-request).
; On Windows bind mounts each stat() crosses the WSL2/host boundary — removing per-request stat
; cuts latency noticeably. 2s is still fast enough to pick up code changes in dev.
opcache.enable                = 1
opcache.revalidate_freq       = 2
opcache.validate_timestamps   = 1
opcache.memory_consumption    = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
opcache.fast_shutdown         = 1
