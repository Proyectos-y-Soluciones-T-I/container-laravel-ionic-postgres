[www]
; Windows Docker Desktop bind mounts are owned by root.
; www-data (UID 82) cannot write to them — run workers as root for dev.
user  = root
group = root

; Dynamic pool — 2 workers ready at startup (was 3 — saves ~40MB idle RAM).
; max_children=10 handles bursts without spawning unboundedly.
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests      = 500
pm.max_spawn_rate    = 10
