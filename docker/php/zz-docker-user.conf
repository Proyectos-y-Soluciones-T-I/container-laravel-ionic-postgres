[www]
; Windows Docker Desktop bind mounts are owned by root.
; www-data (UID 82) cannot write to them — run workers as root for dev.
user  = root
group = root

; Dynamic pool — starts more workers up-front to avoid spawn latency on burst traffic
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests      = 500
pm.max_spawn_rate    = 10
