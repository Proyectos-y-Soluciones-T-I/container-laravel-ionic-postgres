[www]
; Windows Docker Desktop bind mounts are owned by root.
; www-data (UID 82) cannot write to them — run workers as root for dev.
user  = root
group = root

; Dynamic pool — scales workers with load
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500
