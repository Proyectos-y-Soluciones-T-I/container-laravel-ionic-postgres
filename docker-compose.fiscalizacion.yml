# Fiscalizacion — per-project override
# Ports: Nginx 8082 | Frontend 4202 | PostgreSQL 5434 | pgAdmin 5052
#
# Usage:
#   docker compose -f docker-compose.base.yml -f docker-compose.fiscalizacion.yml --project-name fiscalizacion up -d
#   make up PROJECT=fiscalizacion

services:

  # ─── PostgreSQL port override ─────────────────────────────────────────────────
  postgres:
    ports:
      - "${FISCALIZACION_POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_PASSWORD: ${FISCALIZACION_POSTGRES_PASSWORD}
      POSTGRES_DB: fiscalizacion

  # ─── pgAdmin port override ───────────────────────────────────────────────────
  pgadmin:
    ports:
      - "${FISCALIZACION_PGADMIN_PORT:-5052}:80"
    environment:
      PGADMIN_DEFAULT_PASSWORD: ${FISCALIZACION_PGADMIN_PASSWORD}

  # ─── Laravel Backend (PHP 8.1-FPM) ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ${PROJECT}_backend
    volumes:
      - ./src/${PROJECT}/server:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./docker/php/zz-docker-user.conf:/usr/local/etc/php-fpm.d/zz-docker-user.conf
    environment:
      APP_NAME: Fiscalizacion
      PROJECT: ${PROJECT}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${FISCALIZACION_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8082}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fiscalizacion
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${FISCALIZACION_POSTGRES_PASSWORD}
      BROADCAST_DRIVER: log
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      SESSION_LIFETIME: 120
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      MAIL_MAILER: smtp
      MAIL_HOST: ${FISCALIZACION_MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${FISCALIZACION_MAIL_USERNAME}
      MAIL_PASSWORD: ${FISCALIZACION_MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${FISCALIZACION_MAIL_USERNAME}
      MAIL_FROM_NAME: Fiscalizacion
      JWT_SECRET: ${FISCALIZACION_JWT_SECRET}
    networks:
      - ${PROJECT}_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1280M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Nginx (reverse proxy + static files) ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ${PROJECT}_nginx
    ports:
      - "${FISCALIZACION_NGINX_PORT:-8082}:80"
    volumes:
      - ./src/${PROJECT}/server:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ${PROJECT}_net
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Ionic / Angular 17 (dev server) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: ${PROJECT}_frontend
    volumes:
      - ./src/${PROJECT}/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_angular_cache:/app/.angular
    ports:
      - "${FISCALIZACION_FRONTEND_PORT:-4202}:4200"
    environment:
      PROJECT: ${PROJECT}
      NODE_ENV: development
      NODE_OPTIONS: --max_old_space_size=3072
      NPM_CONFIG_PREFER_OFFLINE: "true"
    networks:
      - ${PROJECT}_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fiscalizacion_net:
    driver: bridge

volumes:
  frontend_node_modules:
  frontend_angular_cache:
