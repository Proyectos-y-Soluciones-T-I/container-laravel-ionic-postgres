# Fiscalizacion — servicios del proyecto
# Ports: Nginx 8082 | Frontend 4202
#
# Requiere que docker-compose.shared.yml esté corriendo primero.
#
# Usage:
#   docker compose -f docker-compose.fiscalizacion.yml --project-name fiscalizacion up -d
#   make up PROJECT=fiscalizacion

services:

  # ─── Laravel Backend (PHP 8.1-FPM) ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fiscalizacion_backend
    volumes:
      - ./src/fiscalizacion/server:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./docker/php/zz-docker-user.conf:/usr/local/etc/php-fpm.d/zz-docker-user.conf
      - stack_versions:/versions
    environment:
      APP_NAME: Fiscalizacion
      PROJECT: fiscalizacion
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${FISCALIZACION_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8082}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fiscalizacion
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      BROADCAST_DRIVER: log
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      SESSION_LIFETIME: 120
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      MAIL_MAILER: smtp
      MAIL_HOST: ${FISCALIZACION_MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${FISCALIZACION_MAIL_USERNAME}
      MAIL_PASSWORD: ${FISCALIZACION_MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${FISCALIZACION_MAIL_USERNAME}
      MAIL_FROM_NAME: Fiscalizacion
      JWT_SECRET: ${FISCALIZACION_JWT_SECRET}
    networks:
      - fiscalizacion_net
      - shared_net
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1280M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Nginx (reverse proxy + static files) ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: fiscalizacion_nginx
    ports:
      - "${FISCALIZACION_NGINX_PORT:-8082}:80"
    volumes:
      - ./src/fiscalizacion/server:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fiscalizacion_net
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Ionic 8 / Angular 20 (dev server) ──────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: fiscalizacion_frontend
    volumes:
      - ./src/fiscalizacion/frontend:/app
      - ./docker/frontend/entrypoint.sh:/entrypoint.sh:ro
      - fiscalizacion_node_modules:/app/node_modules
      - fiscalizacion_angular_cache:/app/.angular
      - stack_versions:/versions
    ports:
      - "${FISCALIZACION_FRONTEND_PORT:-4202}:4200"
    environment:
      PROJECT: fiscalizacion
      NODE_ENV: development
      NODE_OPTIONS: --max_old_space_size=4096
      NPM_CONFIG_PREFER_OFFLINE: "true"
    networks:
      - fiscalizacion_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis (cache + sesiones) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fiscalizacion_redis
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - fiscalizacion_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 160M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Android builder (Cordova AAB) ─────────────────────────────────────────
  # ponytail: only starts when explicitly triggered — not part of the dev stack
  # Usage: docker compose -f docker-compose.fiscalizacion.yml --project-name fiscalizacion run --rm android-builder
  #        docker compose ... run --rm android-builder --release
  android-builder:
    build:
      context: .
      dockerfile: docker/android-builder/Dockerfile
    container_name: fiscalizacion_android_builder
    profiles:
      - build
    volumes:
      - ./src/fiscalizacion/frontend:/app
      - fiscalizacion_android_builder_node_modules:/app/node_modules
      - ./secrets/keystore:/keystore:ro
    environment:
      BUILD_MODE: ${BUILD_MODE:-debug}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-}
      KEY_ALIAS: ${KEY_ALIAS:-release}
      KEY_PASSWORD: ${KEY_PASSWORD:-}
    networks:
      - fiscalizacion_net

networks:
  fiscalizacion_net:
    name: fiscalizacion_net
    driver: bridge
  shared_net:
    name: shared_net
    external: true

volumes:
  fiscalizacion_node_modules:
  fiscalizacion_angular_cache:
  fiscalizacion_android_builder_node_modules:
  stack_versions:
    external: true
    name: stack_versions
