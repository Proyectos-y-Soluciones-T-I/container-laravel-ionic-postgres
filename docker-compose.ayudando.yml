# Ayudando — servicios del proyecto
# Ports: Nginx 8080 | Frontend 4200
#
# Requiere que docker-compose.shared.yml esté corriendo primero.
#
# Usage:
#   docker compose -f docker-compose.ayudando.yml --project-name ayudando up -d
#   make up PROJECT=ayudando

services:

  # ─── Laravel Backend (PHP 8.1-FPM) ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ayudando_backend
    volumes:
      - ./src/ayudando/server:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./docker/php/zz-docker-user.conf:/usr/local/etc/php-fpm.d/zz-docker-user.conf
      - stack_versions:/versions
    env_file:
      - .env
      - envs/ayudando.env
    environment:
      APP_NAME: Ayudando
      PROJECT: ayudando
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ayudando}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      BROADCAST_DRIVER: log
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      SESSION_LIFETIME: 120
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      MAIL_MAILER: smtp
      MAIL_FROM_NAME: Ayudando
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
    networks:
      - ayudando_net
      - shared_net
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1280M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Nginx (reverse proxy + static files) ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ayudando_nginx
    ports:
      - "${AYUDANDO_NGINX_PORT:-8080}:80"
    volumes:
      - ./src/ayudando/server:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ayudando_net
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Ionic / Angular 17 (dev server) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: ayudando_frontend
    volumes:
      - ./src/ayudando/frontend:/app
      - ./docker/frontend/entrypoint.sh:/entrypoint.sh:ro
      - ayudando_node_modules:/app/node_modules
      - ayudando_angular_cache:/app/.angular
      - stack_versions:/versions
    ports:
      - "${AYUDANDO_FRONTEND_PORT:-4200}:4200"
    env_file:
      - envs/ayudando.env
    environment:
      PROJECT: ayudando
      NODE_ENV: development
      NODE_OPTIONS: --max_old_space_size=3072
      NPM_CONFIG_PREFER_OFFLINE: "true"
    networks:
      - ayudando_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis (cache + sesiones) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ayudando_redis
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - ayudando_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 160M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  ayudando_net:
    name: ayudando_net
    driver: bridge
  shared_net:
    name: shared_net
    external: true

volumes:
  ayudando_node_modules:
  ayudando_angular_cache:
  stack_versions:
    external: true
    name: stack_versions
