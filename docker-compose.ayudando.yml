# Ayudando — per-project override
# Ports: Nginx 8080 | Frontend 4200 | PostgreSQL 5432 | pgAdmin 5050
#
# Usage:
#   docker compose -f docker-compose.base.yml -f docker-compose.ayudando.yml --project-name ayudando up -d
#   make up PROJECT=ayudando

services:

  # ─── PostgreSQL port override ─────────────────────────────────────────────────
  postgres:
    ports:
      - "${AYUDANDO_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${AYUDANDO_POSTGRES_PASSWORD}
      POSTGRES_DB: ayudando

  # ─── pgAdmin port override ───────────────────────────────────────────────────
  pgadmin:
    ports:
      - "${AYUDANDO_PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_PASSWORD: ${AYUDANDO_PGADMIN_PASSWORD}

  # ─── Laravel Backend (PHP 8.1-FPM) ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ${PROJECT}_backend
    volumes:
      - ./src/${PROJECT}/server:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./docker/php/zz-docker-user.conf:/usr/local/etc/php-fpm.d/zz-docker-user.conf
    environment:
      APP_NAME: Ayudando
      PROJECT: ${PROJECT}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${AYUDANDO_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ayudando
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${AYUDANDO_POSTGRES_PASSWORD}
      BROADCAST_DRIVER: log
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      SESSION_LIFETIME: 120
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      MAIL_MAILER: smtp
      MAIL_HOST: ${AYUDANDO_MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${AYUDANDO_MAIL_USERNAME}
      MAIL_PASSWORD: ${AYUDANDO_MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${AYUDANDO_MAIL_USERNAME}
      MAIL_FROM_NAME: Ayudando
      JWT_SECRET: ${AYUDANDO_JWT_SECRET}
    networks:
      - ${PROJECT}_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1280M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Nginx (reverse proxy + static files) ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ${PROJECT}_nginx
    ports:
      - "${AYUDANDO_NGINX_PORT:-8080}:80"
    volumes:
      - ./src/${PROJECT}/server:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ${PROJECT}_net
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Ionic / Angular 17 (dev server) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: ${PROJECT}_frontend
    volumes:
      - ./src/${PROJECT}/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_angular_cache:/app/.angular
    ports:
      - "${AYUDANDO_FRONTEND_PORT:-4200}:4200"
    environment:
      PROJECT: ${PROJECT}
      NODE_ENV: development
      NODE_OPTIONS: --max_old_space_size=3072
      NPM_CONFIG_PREFER_OFFLINE: "true"
    networks:
      - ${PROJECT}_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ayudando_net:
    driver: bridge

volumes:
  frontend_node_modules:
  frontend_angular_cache:
