# Servicios compartidos entre todos los proyectos
# Levantar UNA SOLA VEZ — no se usa con --project-name
#
# Usage:
#   docker compose -f docker-compose.shared.yml up -d
#   docker compose -f docker-compose.shared.yml down

services:

  # ─── PostgreSQL 14.22 (compartido) ───────────────────────────────────────────
  postgres:
    image: postgres:14.22-alpine
    container_name: shared_postgres
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c effective_cache_size=1GB
      -c random_page_cost=1.1
      -c log_min_duration_statement=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # La DB por defecto — cada proyecto crea la suya vía artisan migrate
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shared_postgres_data:/var/lib/postgresql/data
    networks:
      - shared_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── pgAdmin 7.3 (compartido) ─────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:7.3
    container_name: shared_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - shared_pgadmin_data:/var/lib/pgadmin
    networks:
      - shared_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Dev Dashboard (página de acceso a todos los sistemas) ──────────────────
  dashboard:
    build:
      context: ./docker/dashboard
      dockerfile: Dockerfile
    container_name: shared_dashboard
    # ponytail: bind 127.0.0.1 only — env-data.json contains secrets;
    # never expose the dashboard port to the LAN.
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8090}:80"
    volumes:
      # nginx.conf.template is still bind-mounted so HOST_IP injection works at runtime
      - ./docker/dashboard/nginx.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./docker/dashboard/entrypoint.sh:/entrypoint.sh:ro
      - stack_versions:/usr/share/nginx/html/versions
      - ./.:/repo:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # No shared_net — health proxies use HOST_IP (host gateway), not container
    # DNS. Removing shared_net blocks cross-container curl shared_dashboard:80
    # from other projects' backends (would otherwise read env-data.json).
    networks:
      - default
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M
    logging:
      options:
        max-size: "5m"
        max-file: "2"

networks:
  shared_net:
    name: shared_net
    driver: bridge

volumes:
  shared_postgres_data:
  shared_pgadmin_data:
  stack_versions:
    name: stack_versions
