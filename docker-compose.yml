version: '3.8'

services:

  # ─── PostgreSQL 14.22 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:14.22-alpine
    container_name: ayudando_postgres
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c effective_cache_size=1GB
      -c random_page_cost=1.1
      -c log_min_duration_statement=200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayudando}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - ayudando_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ayudando}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── pgAdmin 7.3 ──────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:7.3
    container_name: ayudando_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ayudando.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - ayudando_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Redis (session + cache en memoria — elimina file I/O de Windows) ────────
  redis:
    image: redis:7-alpine
    container_name: ayudando_redis
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - ayudando_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Laravel Backend (PHP 8.0-FPM) ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ayudando_backend
    volumes:
      - ./ayudando/server:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./docker/php/zz-docker-user.conf:/usr/local/etc/php-fpm.d/zz-docker-user.conf
    environment:
      APP_NAME: Ayudando
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-ayudando}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      BROADCAST_DRIVER: log
      # Redis drivers — eliminan el file I/O de Windows que es la causa de requests lentos
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      SESSION_LIFETIME: 120
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_USERNAME}
      MAIL_FROM_NAME: Ayudando
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - ayudando_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Nginx (reverse proxy + static files) ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ayudando_nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./ayudando/server:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ayudando_net
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Ionic / Angular 17 (dev server) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: ayudando_frontend
    volumes:
      - ./ayudando/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_angular_cache:/app/.angular
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max_old_space_size=1536
      # Speeds up npm install on repeated cold starts
      NPM_CONFIG_PREFER_OFFLINE: "true"
    networks:
      - ayudando_net
    restart: unless-stopped

networks:
  ayudando_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:
  frontend_angular_cache:
